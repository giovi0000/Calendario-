<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendario condiviso</title>
<style>
:root{
  --bg:#fdf4f7; --panel:#ffffff; --fg:#3a1d2b; --muted:#8a6a7a; --line:#f0d6e0;
  --accent:#c2457a; --accent-soft:#fbdde9; --today:#fde9f1; --done:#b89aa8; --day:#6b3fa0; --day-bg:#efe6fb;
  --all-bg:#f8e6ef; --am-bg:#fffbfd; --pm-bg:#f1eaf7; --gut:44px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1f141a; --panel:#2a1c24; --fg:#f7e6ee; --muted:#b592a4; --line:#4a2f3d;
    --accent:#f08cb4; --accent-soft:#4a2536; --today:#3d2230; --done:#7d6070; --day:#c9a6f0; --day-bg:#2e2440;
    --all-bg:#3a2330; --am-bg:#261b22; --pm-bg:#2a2032; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
#period{min-width:150px;text-align:center;font-weight:600;padding:0 6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.scroll{padding:10px}
.side{display:grid;gap:16px;align-content:start;min-width:0}

/* settimana: i 7 giorni occupano tutto lo schermo */
.week{display:grid;gap:6px;width:100%;grid-template-columns:repeat(7,minmax(0,1fr));align-items:start}
.dcol{min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-height:320px}
.dayhead{padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;color:var(--day);background:var(--day-bg);font-weight:650}
.dayhead .dname{display:flex;flex-direction:column;line-height:1.1}
.dayhead strong{font-size:16px;color:var(--fg)}
.dayhead.is-today{background:var(--today)}
.dtog{background:none;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:12px;line-height:18px;color:var(--muted)}
.dtog[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}

/* panoramica del giorno */
.allday{padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--all-bg);min-height:34px;border-bottom:1px solid var(--line)}
.ov{padding:6px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:240px}
.none{color:var(--muted);text-align:center;padding:12px 0;font-size:12px}
.item{display:flex;gap:6px;align-items:flex-start;background:var(--accent-soft);border-radius:6px;padding:5px 6px;font-size:13px;cursor:grab;min-width:0}
.item.cat{background:color-mix(in srgb,var(--c) 25%,var(--panel));border-left:4px solid var(--c)}
.item.done{background:transparent;border:1px dashed var(--line)}
.item.done .ct{text-decoration:line-through;color:var(--done)}
.item.sel,.block.sel{box-shadow:0 0 0 2px var(--accent)}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column}
.ibody .ct{white-space:normal;word-break:break-word;line-height:1.25}
.rng{font-size:11px;color:var(--muted);font-weight:600}
.cell-x{display:none}

/* tabella oraria del giorno aperto */
.tl{position:relative;width:100%;margin:4px 0}
.hl{position:absolute;left:0;width:var(--gut);padding-left:4px;font-size:11px;color:var(--muted);font-weight:600;transform:translateY(-7px)}
.hline{position:absolute;left:var(--gut);right:0;border-top:1px solid var(--line)}
.pl{position:absolute;left:0;right:0;font-size:11px;font-weight:650;color:var(--day);background:var(--day-bg);padding:3px 6px;line-height:16px}
.block{position:absolute;border-radius:6px;padding:4px 6px;background:var(--accent-soft);overflow:hidden;cursor:grab;font-size:12.5px;display:flex;flex-direction:column;gap:2px;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.block.cat{background:color-mix(in srgb,var(--c) 28%,var(--panel));border-left:4px solid var(--c)}
.block.done{opacity:.6}
.block.done .ct{text-decoration:line-through}
.block .ct{white-space:normal;word-break:break-word;line-height:1.2}
.block .rng{font-size:10.5px}
.dragging{opacity:.4}
.over{background:var(--accent-soft)!important}
body.picking .ov,body.picking .allday,body.picking .tl,body.picking .mcell,body.picking #list{outline:1px dashed var(--accent);outline-offset:-3px}

/* mese */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
.month>*{background:var(--panel);min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mhead{padding:6px;font-size:12px;color:var(--day);background:var(--day-bg)!important;text-align:center;font-weight:650}
.mcell{min-height:96px;padding:5px;display:flex;flex-direction:column;gap:4px;background:var(--all-bg)}
.mcell.out{opacity:.45}
.mcell.is-today{background:var(--today)!important}
.mnum{font-size:12px;color:var(--muted);font-weight:600}

/* lista e categorie */
.chip{display:flex;align-items:center;gap:5px;background:var(--accent-soft);border-radius:6px;padding:3px 4px 3px 3px;font-size:12.5px;cursor:grab;user-select:none;min-width:0}
.chip.cat{background:color-mix(in srgb,var(--c) 25%,var(--panel));border-left:4px solid var(--c)}
.chip.done{background:transparent;border:1px dashed var(--line);color:var(--done)}
.chip.done.cat{border-left:4px solid var(--c)}
.chip.done .ct{text-decoration:line-through}
.chip.sel{box-shadow:0 0 0 2px var(--accent)}
.ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck,.x{flex:none;border:0;background:none;padding:0;line-height:1;color:var(--muted);font-size:13px;width:16px;height:16px;display:grid;place-items:center;border-radius:4px}
.ck{border:1px solid var(--muted);border-radius:4px;font-size:10px;color:var(--accent)}
.x:hover,.ck:hover{color:var(--fg)}
.panel h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:12px}
.add #newTitle{grid-column:1/-1}
.add input,.add select,.catadd input,.catadd select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.add .btn,.catadd .btn{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.list{padding:0 12px 12px;display:grid;gap:6px;min-height:120px;border-radius:0 0 12px 12px}
.grp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;margin-top:8px}
.grp .gcount{margin-left:auto;font-weight:400;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.catrow{display:flex;align-items:center;gap:6px;padding:4px 12px}
.catrow input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.catname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catadd{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;align-items:center}
.catadd input[type=text]{flex:1;min-width:120px}
.catadd input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}

/* modifica attività: orari da compilare */
#editor{grid-column:1/-1;display:none}
#editor.on{display:block}
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:14px}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.ed label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.ed input,.ed select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--fg);min-width:0;width:100%}
.ed input[type=checkbox]{width:auto}
.ed input:disabled{opacity:.4}
.edbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:end;grid-column:1/-1}
.edbtns .btn.danger{border-color:var(--accent);color:var(--accent)}
.edtitle{font-size:12px;color:var(--muted);padding:12px 14px 0}
#status{min-height:1.4em;color:var(--muted);font-size:13px;grid-column:1/-1}

/* telefono */
@media (max-width:600px){
  :root{--gut:34px}
  body{padding:10px}
  .week{gap:3px}
  .dayhead{padding:4px 2px;flex-direction:column;align-items:center;font-size:10px}
  .dayhead strong{font-size:13px}
  .dtog{padding:0 4px}
  .item{font-size:11px;padding:4px}
  .block{font-size:11px;padding:3px 4px}
  .hl{font-size:9px;padding-left:2px}
  .pl{font-size:9px}
  .ov{min-height:200px}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Calendario condiviso</h1>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Precedente">‹</button>
      <button class="btn" id="today">Oggi</button>
      <button class="btn" id="next" aria-label="Successivo">›</button>
      <span id="period"></span>
      <button class="btn" id="vw" aria-pressed="true" data-view="week">Settimana</button>
      <button class="btn" id="vm" aria-pressed="false" data-view="month">Mese</button>
      <button class="btn" id="fs">Schermo intero</button>
    </div>
  </header>

  <section class="panel"><div class="scroll" id="cal"></div></section>

  <section class="panel" id="editor">
    <h2>Modifica attività <button class="btn" id="edClose">Chiudi</button></h2>
    <div class="edtitle">Tocca un giorno o un'ora del calendario per spostarla, oppure compila i campi qui sotto.</div>
    <div class="ed">
      <label>Titolo <input id="edTitle" type="text" maxlength="200"></label>
      <label>Categoria <select id="edCat"></select></label>
      <label>Giorno <input id="edDay" type="date"></label>
      <label class="inline"><input id="edAll" type="checkbox"> Tutto il giorno</label>
      <label>Dalle <input id="edFrom" type="time" step="900"></label>
      <label>Alle <input id="edTo" type="time" step="900"></label>
      <label class="inline"><input id="edDone" type="checkbox"> Fatta</label>
      <div class="edbtns">
        <button class="btn" id="edUnsched">Togli dal calendario</button>
        <button class="btn danger" id="edDel">Elimina</button>
      </div>
    </div>
  </section>

  <div class="side">
    <aside class="panel">
      <h2>Da organizzare <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="add">
        <input id="newTitle" type="text" placeholder="Nuova attività" maxlength="200" aria-label="Nuova attività">
        <select id="newCat" aria-label="Categoria"></select>
        <button class="btn" id="addBtn">Aggiungi</button>
      </div>
      <div class="list" id="list" data-drop="list"></div>
    </aside>

    <aside class="panel">
      <h2>Categorie</h2>
      <div id="catList"></div>
      <div class="catadd">
        <input id="catName" type="text" placeholder="Nome categoria" maxlength="60" aria-label="Nome categoria">
        <input id="catColor" type="color" value="#c2457a" aria-label="Colore categoria">
        <button class="btn" id="catAdd">Crea</button>
      </div>
    </aside>
  </div>

  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---- configurazione Supabase ----
const SUPABASE_URL = 'https://mugzdzlyugjdprezcbac.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11Z3pkemx5dWdqZHByZXpjYmFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4ODg4MTQsImV4cCI6MjEwOTQ2NDgxNH0.ojM-G8vJRUXHI1deq3uPAvUcb3zJMbImcUd-jCdj44g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- impostazioni della tabella oraria: modificabili qui ----
const T0 = 8 * 60;    // inizio tabella: 08:00
const T1 = 19 * 60;   // fine tabella: 19:00
const PM = 13 * 60;   // inizio pomeriggio
const ROW_H = 44;     // altezza di un'ora, in pixel
const HEAD_H = 22;    // etichetta "Mattina" in cima
const DIV_H = 22;     // etichetta "Pomeriggio" tra le due parti
const LEGACY_SLOT = {am: '08:00-12:00', pm: '13:00-18:00'};

// ---- utilità ----
const WD = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
function pad(n){ return String(n).padStart(2,'0'); }
const HM = m => `${pad(Math.floor(m/60))}:${pad(m % 60)}`;
const toMin = v => { const [h,m] = v.split(':').map(Number); return h*60 + m; };
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey = () => fmt(new Date());
const $ = id => document.getElementById(id);

// ---- orario di un'attività ----
// Salvato nella colonna "slot" come "09:00-11:00". Nessun orario = tutto il giorno.
function parseSlot(s){
  if (!s || s === 'all') return null;
  const m = String(s).match(/^(\d{1,2})(?::(\d{2}))?(?:-(\d{1,2})(?::(\d{2}))?)?$/);
  if (!m) return null;
  const from = (+m[1])*60 + (+(m[2] || 0));
  let to = m[3] !== undefined ? (+m[3])*60 + (+(m[4] || 0)) : from + 60;
  if (to <= from) to = from + 60;
  return {from, to};
}
const encRange = (from, to) => `${HM(from)}-${HM(to)}`;

// posizione verticale di un orario nella tabella
function yOf(min){ return HEAD_H + (min - T0)/60*ROW_H + (min >= PM ? DIV_H : 0); }
const TOTAL = yOf(T1);
// da una posizione verticale ricava l'ora (arrotondata all'ora piena)
function minFromY(y){
  let m = T0;
  for (let h = T0/60; h < T1/60; h++){ if (y >= yOf(h*60)) m = h*60; }
  return m;
}

// ---- stato ----
let tasks = [];        // {id, title, day, slot, done, category, createdAt}
let categories = [];   // {id, name, color, position}
let view = 'week';
let cursor = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
let selectedId = null;
let expandedDays = new Set();
let statusTimer = null;

function flash(msg){
  const el = $('status');
  el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.textContent = ''; }, 5000);
}

// ---- dati (Supabase) ----
function taskFromDb(r){
  let slot = r.slot || null;
  if (LEGACY_SLOT[slot]) slot = LEGACY_SLOT[slot];
  return {id:r.id, title:r.title, day:r.day, slot, done:!!r.done, category:r.category||null, createdAt:r.created_at||0};
}
function catFromDb(r){
  return {id:r.id, name:r.name, color:r.color, position:r.position||0};
}
async function loadAll(){
  const [t, c] = await Promise.all([
    sb.from('tasks').select('*'),
    sb.from('categories').select('*').order('position', {ascending:true})
  ]);
  if (t.error || c.error){ flash('Non riesco a caricare i dati. Ricarica la pagina.'); return; }
  tasks = t.data.map(taskFromDb);
  categories = c.data.map(catFromDb);
  render();
}
const catById = id => categories.find(c => c.id === id);
const colorOf = t => { const c = t.category ? catById(t.category) : null; return c ? c.color : null; };
const taskById = id => tasks.find(x => x.id === id);

async function saveChange(id, patch){
  const t = taskById(id); if (!t) return;
  Object.assign(t, patch);
  render();
  const dbPatch = {};
  for (const k of ['title','done','day','slot','category']) if (k in patch) dbPatch[k] = patch[k];
  const {error} = await sb.from('tasks').update(dbPatch).eq('id', id);
  if (error){ flash('Modifica non salvata, riprova.'); loadAll(); }
}
async function addTask(title, category){
  title = title.trim(); if (!title) return;
  const row = {id: crypto.randomUUID(), title, day:null, slot:null, done:false, category: category || null, created_at: Date.now()};
  tasks.push(taskFromDb(row)); render();
  const {error} = await sb.from('tasks').insert(row);
  if (error){ flash('Attività non salvata, riprova.'); loadAll(); }
}
async function removeTask(id){
  tasks = tasks.filter(t => t.id !== id); if (selectedId === id) selectedId = null; render();
  const {error} = await sb.from('tasks').delete().eq('id', id);
  if (error){ flash('Eliminazione non riuscita, riprova.'); loadAll(); }
}
function move(id, day, slot){
  selectedId = null;
  saveChange(id, {day: day || null, slot: slot || null});
}
// trascinamento o tocco su un'ora: l'attività mantiene la sua durata
function dropOnTime(id, day, min){
  const t = taskById(id); if (!t) return;
  const r = parseSlot(t.slot);
  const dur = r ? r.to - r.from : 60;
  const from = Math.min(min, T1 - dur);
  move(id, day, encRange(from, from + dur));
}
function selectTask(id){
  selectedId = (selectedId === id) ? null : id;
  render();
}
async function addCategory(name, color){
  name = name.trim(); if (!name) return;
  const row = {id: crypto.randomUUID(), name, color: color || '#c2457a', position: categories.length + 1};
  categories.push(catFromDb(row)); render();
  const {error} = await sb.from('categories').insert(row);
  if (error){ flash('Categoria non salvata, riprova.'); loadAll(); }
}
async function updateCategory(id, patch){
  const c = catById(id); if (!c) return;
  Object.assign(c, patch); render();
  const dbPatch = {};
  if ('name' in patch) dbPatch.name = patch.name;
  if ('color' in patch) dbPatch.color = patch.color;
  const {error} = await sb.from('categories').update(dbPatch).eq('id', id);
  if (error){ flash('Modifica categoria non salvata.'); loadAll(); }
}
async function removeCategory(id){
  const c = catById(id); if (!c) return;
  if (!confirm(`Eliminare la categoria “${c.name}”? Le attività resteranno senza categoria.`)) return;
  tasks.forEach(t => { if (t.category === id) t.category = null; });
  categories = categories.filter(x => x.id !== id); render();
  const {error} = await sb.from('categories').delete().eq('id', id);
  if (error){ flash('Eliminazione categoria non riuscita.'); loadAll(); }
}

// ---- rendering ----
const tasksFor = key => tasks.filter(t => t.day === key);
const byStart = (a,b) => (parseSlot(a.slot)?.from ?? 0) - (parseSlot(b.slot)?.from ?? 0);
const byTime = (a,b) => (a.done?1:0)-(b.done?1:0) || (a.createdAt||0)-(b.createdAt||0);

// elemento della panoramica (testo intero, a capo)
function item(t){
  const col = colorOf(t);
  const style = col ? ` style="--c:${col}"` : '';
  const r = parseSlot(t.slot);
  const range = r ? `<span class="rng">${HM(r.from)}–${HM(r.to)}</span>` : '';
  return `<div class="item ${col?'cat':''} ${t.done?'done':''} ${selectedId===t.id?'sel':''}"${style} data-task="${t.id}" draggable="true">
    <button type="button" class="ck" data-act="done" aria-label="Segna come fatta">${t.done?'✓':''}</button>
    <div class="ibody">${range}<span class="ct">${esc(t.title)}</span></div></div>`;
}
// elemento compatto per lista e mese
function chip(t, mode, withRange){
  const col = colorOf(t);
  const style = col ? ` style="--c:${col}"` : '';
  const r = withRange ? parseSlot(t.slot) : null;
  const rl = r ? `<span class="rng">${HM(r.from)}–${HM(r.to)}</span>` : '';
  const btn = mode === 'del'
    ? `<button type="button" class="x" data-act="del" aria-label="Elimina">✕</button>`
    : `<button type="button" class="x" data-act="unsched" aria-label="Togli dal calendario">↩</button>`;
  return `<div class="chip ${col?'cat':''} ${t.done?'done':''} ${selectedId===t.id?'sel':''}"${style} data-task="${t.id}" draggable="true">
    <button type="button" class="ck" data-act="done" aria-label="Segna come fatta">${t.done?'✓':''}</button>
    ${rl}<span class="ct" title="${esc(t.title)}">${esc(t.title)}</span>${btn}</div>`;
}

// colonne sovrapposte: attività che si accavallano stanno affiancate
function assignLanes(list){
  const ends = [];
  const out = list.slice().sort(byStart).map(t => {
    const r = parseSlot(t.slot);
    let i = ends.findIndex(e => e <= r.from);
    if (i < 0){ i = ends.length; ends.push(r.to); } else ends[i] = r.to;
    return {t, lane: i};
  });
  return {items: out, n: Math.max(1, ends.length)};
}

// tabella oraria: un'attività lunga occupa un unico blocco continuo
function timelineHTML(key, timed){
  let h = `<div class="tl" data-drop="tl" data-tl data-day="${key}" style="height:${TOTAL}px">`;
  h += `<div class="pl" style="top:0;height:${HEAD_H}px">Mattina</div>`;
  for (let hr = T0/60; hr < T1/60; hr++){
    const top = yOf(hr*60);
    h += `<div class="hl" style="top:${top}px">${pad(hr)}:00</div><div class="hline" style="top:${top}px"></div>`;
  }
  h += `<div class="pl" style="top:${yOf(PM)-DIV_H}px;height:${DIV_H}px">Pomeriggio</div>`;
  const {items, n} = assignLanes(timed);
  for (const {t, lane} of items){
    const r = parseSlot(t.slot);
    const top = yOf(r.from);
    const height = Math.max(yOf(r.to) - top, 24);
    const col = colorOf(t);
    const style = `top:${top}px;height:${height}px;left:calc(var(--gut) + (100% - var(--gut)) * ${lane} / ${n});width:calc((100% - var(--gut)) / ${n} - 4px);` +
                  (col ? `--c:${col}` : '');
    h += `<div class="block ${col?'cat':''} ${t.done?'done':''} ${selectedId===t.id?'sel':''}" style="${style}" data-task="${t.id}" draggable="true">
      <span class="rng">${HM(r.from)}–${HM(r.to)}</span><span class="ct">${esc(t.title)}</span></div>`;
  }
  return h + `</div>`;
}

function renderWeek(){
  const start = mondayOf(cursor);
  const days = [...Array(7)].map((_,i) => addDays(start,i));
  const today = todayKey();
  const cols = days.map(d => expandedDays.has(fmt(d)) ? 'minmax(0,2.6fr)' : 'minmax(0,1fr)').join(' ');
  let h = `<div class="week" style="grid-template-columns:${cols}">`;
  days.forEach(d => {
    const key = fmt(d);
    const open = expandedDays.has(key);
    const dayTasks = tasksFor(key);
    const allDay = dayTasks.filter(t => !parseSlot(t.slot)).sort(byTime);
    const timed = dayTasks.filter(t => parseSlot(t.slot)).sort(byStart);
    h += `<div class="dcol">
      <div class="dayhead ${key===today?'is-today':''}">
        <span class="dname"><span>${WD[(d.getDay()+6)%7]}</span><strong>${d.getDate()}</strong></span>
        <button type="button" class="dtog" data-toggle="${key}" aria-expanded="${open}" aria-label="Apri la tabella oraria">${open?'▴':'▾'}</button>
      </div>`;
    if (open){
      h += `<div class="allday" data-drop="zone" data-day="${key}">${allDay.map(item).join('')}</div>`;
      h += timelineHTML(key, timed);
    } else {
      const all = [...allDay, ...timed];
      h += `<div class="ov" data-drop="zone" data-day="${key}">${all.map(item).join('')}${all.length ? '' : '<div class="none">Niente in programma</div>'}</div>`;
    }
    h += `</div>`;
  });
  return h + `</div>`;
}
function renderMonth(){
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const start = mondayOf(first);
  const today = todayKey();
  let h = `<div class="month">` + WD.map(w => `<div class="mhead">${w}</div>`).join('');
  for (let i=0;i<42;i++){
    const d = addDays(start,i), key = fmt(d);
    const out = d.getMonth() !== cursor.getMonth();
    h += `<div class="mcell ${out?'out':''} ${key===today?'is-today':''}" data-drop="zone" data-day="${key}">
      <span class="mnum">${d.getDate()}</span>${tasksFor(key).sort(byStart).map(t=>chip(t,'unsched',true)).join('')}</div>`;
  }
  return h + `</div>`;
}
function renderList(){
  const open = tasks.filter(t => !t.day);
  $('count').textContent = open.length ? `(${open.length})` : '';
  let h = '';
  categories.forEach(c => {
    const items = open.filter(t => t.category === c.id).sort(byTime);
    if (!items.length) return;
    h += `<div class="grp"><span class="dot" style="background:${c.color}"></span><span>${esc(c.name)}</span><span class="gcount">${items.length}</span></div>`;
    h += items.map(t => chip(t,'del')).join('');
  });
  const none = open.filter(t => !t.category || !catById(t.category)).sort(byTime);
  if (none.length){
    if (categories.length) h += `<div class="grp"><span>Senza categoria</span><span class="gcount">${none.length}</span></div>`;
    h += none.map(t => chip(t,'del')).join('');
  }
  $('list').innerHTML = h || `<div class="empty">Nessuna attività da organizzare. Scrivine una sopra e trascinala sul calendario.</div>`;
}
function catOptions(selected){
  return `<option value="">Senza categoria</option>` +
    categories.map(c => `<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('');
}
function renderCats(){
  $('catList').innerHTML = categories.length ? categories.map(c => `
    <div class="catrow">
      <input type="color" value="${c.color}" data-cat="${c.id}" aria-label="Colore di ${esc(c.name)}">
      <span class="catname">${esc(c.name)}</span>
      <button type="button" class="x" data-cat-act="rename" data-id="${c.id}" aria-label="Rinomina">✎</button>
      <button type="button" class="x" data-cat-act="del" data-id="${c.id}" aria-label="Elimina categoria">✕</button>
    </div>`).join('')
    : `<div class="empty">Nessuna categoria. Creane una qui sotto.</div>`;
  const keep = $('newCat').value;
  $('newCat').innerHTML = catOptions(keep);
}
function renderHeader(){
  let label;
  if (view === 'week'){
    const s = mondayOf(cursor), e = addDays(s,6);
    label = `${s.toLocaleDateString('it-IT',{day:'numeric',month:'short'})} – ${e.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}`;
  } else {
    const t = cursor.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
    label = t.charAt(0).toUpperCase() + t.slice(1);
  }
  $('period').textContent = label;
  $('vw').setAttribute('aria-pressed', view==='week');
  $('vm').setAttribute('aria-pressed', view==='month');
}
// campi di modifica: si aggiornano senza disturbare chi sta scrivendo
function setVal(el, v){ if (document.activeElement !== el) el.value = v; }
function renderEditor(){
  const t = taskById(selectedId);
  $('editor').classList.toggle('on', !!t);
  document.body.classList.toggle('picking', !!t);
  if (!t) return;
  const r = parseSlot(t.slot);
  setVal($('edTitle'), t.title);
  if (document.activeElement !== $('edCat')) $('edCat').innerHTML = catOptions(t.category);
  setVal($('edDay'), t.day || '');
  $('edAll').checked = !r;
  $('edFrom').disabled = !r;
  $('edTo').disabled = !r;
  setVal($('edFrom'), r ? HM(r.from) : '09:00');
  setVal($('edTo'), r ? HM(r.to) : '10:00');
  $('edDone').checked = !!t.done;
}
function render(){
  renderHeader();
  $('cal').innerHTML = view === 'week' ? renderWeek() : renderMonth();
  renderList();
  renderCats();
  renderEditor();
}

// ---- trascinamento e tocco sulle zone del calendario ----
function applyDrop(zone, clientY, id){
  if (zone.dataset.drop === 'list'){ move(id, null, null); return; }
  const day = zone.dataset.day;
  if (zone.hasAttribute('data-tl')){
    const rect = zone.getBoundingClientRect();
    dropOnTime(id, day, minFromY(clientY - rect.top));
  } else {
    const t = taskById(id); move(id, day, t ? t.slot : null);
  }
}

// ---- interazione ----
const root = document.querySelector('.wrap');
root.addEventListener('click', e => {
  const tog = e.target.closest('[data-toggle]');
  if (tog){
    const key = tog.dataset.toggle;
    expandedDays.has(key) ? expandedDays.delete(key) : expandedDays.add(key);
    render(); return;
  }
  const cat = e.target.closest('[data-cat-act]');
  if (cat){
    const c = catById(cat.dataset.id); if (!c) return;
    if (cat.dataset.catAct === 'del') removeCategory(c.id);
    if (cat.dataset.catAct === 'rename'){
      const name = prompt('Nuovo nome della categoria:', c.name);
      if (name && name.trim()) updateCategory(c.id, {name: name.trim()});
    }
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act){
    const id = act.closest('[data-task]').dataset.task;
    const t = taskById(id); if (!t) return;
    if (act.dataset.act === 'done') saveChange(id, {done: !t.done});
    if (act.dataset.act === 'unsched'){ if (selectedId === id) selectedId = null; saveChange(id, {day:null, slot:null}); }
    if (act.dataset.act === 'del') removeTask(id);
    return;
  }
  // con un'attività scelta, un tocco su una zona la sposta lì (tranne se si tocca un'altra attività della lista)
  const zone = e.target.closest('[data-drop]');
  const onListItem = e.target.closest('#list [data-task]');
  if (selectedId && zone && !onListItem){
    applyDrop(zone, e.clientY, selectedId);
    return;
  }
  const task = e.target.closest('[data-task]');
  if (task) selectTask(task.dataset.task);
});

root.addEventListener('change', e => {
  const id = selectedId; const t = id && taskById(id);
  if (e.target.matches('input[type=color][data-cat]')){
    updateCategory(e.target.dataset.cat, {color: e.target.value});
  }
  if (!t) return;
  switch (e.target.id){
    case 'edTitle': {
      const v = e.target.value.trim();
      if (v) saveChange(id, {title: v}); else render();
      break;
    }
    case 'edCat': saveChange(id, {category: e.target.value || null}); break;
    case 'edDay': saveChange(id, {day: e.target.value || null}); break;
    case 'edAll': {
      if (e.target.checked) saveChange(id, {slot: null});
      else saveChange(id, {slot: encRange(9*60, 10*60)});
      break;
    }
    case 'edFrom': {
      const r = parseSlot(t.slot) || {from: 9*60, to: 10*60};
      const from = toMin(e.target.value);
      const to = r.to > from ? r.to : from + 60;
      saveChange(id, {slot: encRange(from, to)});
      break;
    }
    case 'edTo': {
      const r = parseSlot(t.slot) || {from: 9*60, to: 10*60};
      const to = toMin(e.target.value);
      if (to <= r.from){ flash('L’orario di fine deve essere dopo quello di inizio.'); render(); break; }
      saveChange(id, {slot: encRange(r.from, to)});
      break;
    }
    case 'edDone': saveChange(id, {done: e.target.checked}); break;
  }
});

root.addEventListener('dragstart', e => {
  const task = e.target.closest('[data-task]'); if (!task) return;
  e.dataTransfer.setData('text/plain', task.dataset.task);
  e.dataTransfer.effectAllowed = 'move';
  task.classList.add('dragging');
});
root.addEventListener('dragend', e => {
  const task = e.target.closest('[data-task]'); if (task) task.classList.remove('dragging');
});
root.addEventListener('dragover', e => {
  const zone = e.target.closest('[data-drop]'); if (!zone) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.over').forEach(n => n.classList.remove('over'));
  zone.classList.add('over');
});
root.addEventListener('dragleave', e => {
  const zone = e.target.closest('[data-drop]'); if (zone) zone.classList.remove('over');
});
root.addEventListener('drop', e => {
  const zone = e.target.closest('[data-drop]'); if (!zone) return;
  e.preventDefault();
  document.querySelectorAll('.over').forEach(n => n.classList.remove('over'));
  const id = e.dataTransfer.getData('text/plain'); if (!id) return;
  applyDrop(zone, e.clientY, id);
});

$('prev').onclick = () => {
  cursor = view==='week' ? addDays(cursor,-7) : new Date(cursor.getFullYear(), cursor.getMonth()-1, 1); render();
};
$('next').onclick = () => {
  cursor = view==='week' ? addDays(cursor,7) : new Date(cursor.getFullYear(), cursor.getMonth()+1, 1); render();
};
$('today').onclick = () => { const n = new Date(); cursor = new Date(n.getFullYear(), n.getMonth(), n.getDate()); render(); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
$('fs').onclick = () => {
  if (document.fullscreenElement){ document.exitFullscreen?.(); }
  else { document.documentElement.requestFullscreen?.().catch(() => flash('Schermo intero non disponibile su questo dispositivo.')); }
};
$('edClose').onclick = () => { selectedId = null; render(); };
$('edUnsched').onclick = () => { if (selectedId){ const id = selectedId; selectedId = null; saveChange(id, {day:null, slot:null}); } };
$('edDel').onclick = () => { if (selectedId && confirm('Eliminare questa attività?')){ removeTask(selectedId); } };
$('addBtn').onclick = () => {
  const input = $('newTitle');
  addTask(input.value, $('newCat').value);
  input.value = ''; input.focus();
};
$('newTitle').addEventListener('keydown', e => { if (e.key === 'Enter') $('addBtn').click(); });
$('catAdd').onclick = () => {
  const name = $('catName');
  addCategory(name.value, $('catColor').value);
  name.value = ''; name.focus();
};
$('catName').addEventListener('keydown', e => { if (e.key === 'Enter') $('catAdd').click(); });

// ---- avvio ----
render();
loadAll();
// ogni modifica fatta da un altro telefono aggiorna la pagina
sb.channel('calendario')
  .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, () => loadAll())
  .on('postgres_changes', {event:'*', schema:'public', table:'categories'}, () => loadAll())
  .subscribe();
</script>
</body>
